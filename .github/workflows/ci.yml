name: Elei CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: Build Spring Boot backend
    runs-on: ubuntu-latest

    steps:
    - name: Downloading code from repository
      uses: actions/checkout@v4

    - name: Downloading java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Collecting backend
      working-directory: ./backend
      run: mvn clean package -DskipTests


  build-frontend:
    name: Build Vue.js Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Downloading code from repository
      uses: actions/checkout@v4

    - name: Downloading Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Downloading dependency and collecting frontend
      working-directory: ./frontend
      run: |
        npm install
        npm run build


  publish-docker:
    name: Build and Push Docker Images
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
    - name: Downloading code from Repository
      uses: actions/checkout@v4

    - name: DockerHub authorization
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}

    - name: Backend Assembly and Export
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{secrets.DOCKER_USERNAME}}/elei-backend:latest

    - name: Frontend Assembly and Export
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{secrets.DOCKER_USERNAME}}/elei-frontend:latest

    - name: Notification Service Assembly and Export
      uses: docker/build-push-action@v5
      with:
        context: ./kafka-consumer
        push: true
        tags: ${{secrets.DOCKER_USERNAME}}/elei-notification:latest
