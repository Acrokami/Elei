services:
  # Database
  postgres-db:
    image: postgres:15-alpine
    container_name: elei-postgres
    restart: always
    environment:
       POSTGRES_USER: ${POSTGRES_USER:-postgres}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
       POSTGRES_DB: ${POSTGRES_DB:-elei}
    ports:
      - "5432:5432"
    volumes:
      - elei-pg-data:/var/lib/postgresql/data
    networks:
      - elei-network

  backend:
    build:
      context: ./backend
    container_name: elei-backend
    restart: always
    environment:
      DB_HOST: postgres-db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-root}
      DB_NAME: ${POSTGRES_DB:-elei}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - elei-network


  notification-service:
    build:
      context: ./kafka-consumer
    container_name: elei-notification
    restart: always
    environment:
        KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - elei-network

  frontend:
    build:
      context: ./frontend
    container_name: elei-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - elei-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: elei-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - elei-network


  redis:
    image: redis:7-alpine
    container_name: elei-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - elei-network



  prometheus:
    image: prom/prometheus:latest
    container_name: elei-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - elei-network


  grafana:
    image: grafana/grafana:latest
    container_name: elei-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - elei-network


networks:
  elei-network:
    driver: bridge

volumes:
  elei-pg-data:
